<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain Tumor Detection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            color: #0d6efd;
            margin-bottom: 10px;
        }

        h3 {
            color: #555;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #0d6efd;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 13px 35px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #084298;
        }

        .success {
            color: green;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .warning {
            margin-top: 30px;
            color: #777;
            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>🧠 Brain Tumor Detection System</h1>

    <h3>AI-Powered MRI Image Analysis</h3>


    {% if message %}

        <p class="success">
            {{ message }}
        </p>

    {% endif %}


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}


        <div class="upload-box">

            <p>
                Select an MRI image
            </p>


            <input
                type="file"
                name="image"
                accept="image/jpeg,image/png,image/jpg"
                required
            >

        </div>


        <button type="submit">
            🔍 Predict
        </button>

    </form>


    <p class="warning">
        This system is an educational AI project
        and should not be used as a medical diagnosis.
    </p>

</div>


</body>

</html>
