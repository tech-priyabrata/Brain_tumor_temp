<!DOCTYPE html>
<html>
<head>

    <title>Brain Tumor Detection Result</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px #bbb;
            text-align: center;
        }

        h1 {
            color: #0d6efd;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            background: #f0f8ff;
        }

        .prediction {
            font-size: 30px;
            font-weight: bold;
            color: #198754;
            text-transform: capitalize;
        }

        .confidence {
            font-size: 22px;
            margin-top: 15px;
            color: #333;
        }

        .image-name {
            margin-top: 15px;
            color: #666;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
        }

        .back-button:hover {
            background: #084298;
        }

        .warning {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🧠 Brain Tumor Detection Result</h1>

    <div class="result">

        <h2>Prediction</h2>

        <div class="prediction">
            {{ prediction }}
        </div>

        <div class="confidence">
            Confidence: <strong>{{ confidence }}%</strong>
        </div>

        <div class="image-name">
            Image: {{ image_name }}
        </div>

    </div>

    <a href="/" class="back-button">
        🔄 Analyze Another Image
    </a>

    <div class="warning">
        This system is an educational AI project and should not
        be used as a medical diagnosis.
    </div>

</div>

</body>
</html>
